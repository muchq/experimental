name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS builds against a hermetic SDK trimmed to a framework list in
        # MODULE.bazel; only a mac build checks that list.
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # No test targets yet; building every target is the check.
      - name: Build
        run: bazel build //...
